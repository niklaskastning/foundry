name: Foundry checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundry-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Check changed files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: vp run check:changed "$BASE_REF" --concurrency 1
      - name: Check restricted Foundry updater
        run: python3 -B -m unittest discover -s deploy/fork/updater -p 'test_*.py'
